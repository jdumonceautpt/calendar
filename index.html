<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jours fériés dans le monde</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

/* ============================================================
   Jetons de couleur
   Rampe neutre légèrement froide + un seul accent (teal).
   Les rôles « texte » et « bordure » sont séparés : la version
   précédente utilisait la même valeur claire pour les deux, ce
   qui mettait le placeholder de recherche à 2,6:1 sur blanc.
   ============================================================ */
:root {
  color-scheme: light;

  --bg:            #F3F5F8;
  --surface:       #FFFFFF;
  --surface-2:     #F9FAFC;   /* jours hors mois */
  --surface-3:     #EFF2F6;   /* week-ends, survols */
  --surface-sunk:  #E9EDF2;

  --border:        #E2E7EE;
  --border-strong: #CBD4DE;
  --divider:       #ECEFF4;   /* gouttières de grille */

  --text:          #171E28;   /* 15.8:1 sur surface */
  --text-2:        #525D6B;   /*  7.4:1 */
  --text-3:        #69737F;   /*  5.3:1 — plancher pour tout texte */
  --glyph:         #97A1AE;   /* icônes et traits uniquement, jamais du texte */

  --accent:        #16666F;
  --accent-hover:  #10545C;
  --accent-ink:    #0E5A62;   /* accent sur fond clair : 5.4:1 */
  --accent-soft:   #E4EFF0;
  --accent-line:   #B6D2D5;
  --on-accent:     #FFFFFF;

  --today-bg:      #E7F4EB;
  --today-line:    #BFDFC8;
  --holiday-bg:    #FBEBEA;
  --holiday-line:  #EFCFCD;

  --warn-bg:       #FCF0E8;
  --warn-line:     #EACCB8;
  --warn-ink:      #8A4A22;

  --star:          #B8860B;
  --star-soft:     #F6EED8;

  --ring:          #1B7C86;   /* anneau de focus */
  --dot-ring:      #FFFFFF;   /* liseré des pastilles, = surface */
  --flag-edge:     rgba(23,30,40,.14);
  --scrim:         rgba(17,23,31,.34);
  --shadow-sm:     0 1px 2px rgba(20,27,36,.07);
  --shadow-md:     0 2px 6px rgba(20,27,36,.07), 0 1px 2px rgba(20,27,36,.05);
  --shadow-lg:     -14px 0 36px rgba(16,22,30,.13), -2px 0 6px rgba(16,22,30,.06);
  --shadow-rail:   14px 0 36px rgba(16,22,30,.16);

  /* échelle typographique, pas de fluide : l'utilisateur est à DPI constant */
  --fs-xs:   11px;
  --fs-sm:   12px;
  --fs-base: 13px;
  --fs-md:   14px;
  --fs-lg:   15.5px;
  --fs-xl:   18px;

  --r-sm: 5px;
  --r-md: 7px;
  --r-lg: 10px;
  --r-xl: 14px;
  --r-pill: 999px;
}

/* Le thème sombre a deux déclencheurs : la préférence système quand aucun
   choix explicite n'est stocké, et l'attribut data-theme quand il l'est.
   Les deux blocs portent les mêmes valeurs, aucun ne peut être factorisé
   sans que l'un prenne le pas sur l'autre au mauvais moment. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --bg:            #101419;
    --surface:       #171D24;
    --surface-2:     #13181F;
    --surface-3:     #1E252E;
    --surface-sunk:  #0C1015;

    --border:        #29323D;
    --border-strong: #3A4552;
    --divider:       #202832;

    --text:          #E7ECF2;
    --text-2:        #A3AEBB;
    --text-3:        #8B96A3;
    --glyph:         #6E7885;

    --accent:        #3FA7B4;
    --accent-hover:  #55BAC6;
    --accent-ink:    #6FC6D1;
    --accent-soft:   #16303A;
    --accent-line:   #23505C;
    --on-accent:     #08252A;

    --today-bg:      #14301F;
    --today-line:    #27563A;
    --holiday-bg:    #32191C;
    --holiday-line:  #5A2A2E;

    --warn-bg:       #2E1D12;
    --warn-line:     #573A24;
    --warn-ink:      #E8B98F;

    --star:          #D8A93A;
    --star-soft:     #2C2415;

    --ring:          #4FB6C2;
    --dot-ring:      #171D24;
    --flag-edge:     rgba(255,255,255,.18);
    --scrim:         rgba(4,7,10,.62);
    --shadow-sm:     0 1px 2px rgba(0,0,0,.4);
    --shadow-md:     0 2px 8px rgba(0,0,0,.34), 0 1px 2px rgba(0,0,0,.3);
    --shadow-lg:     -14px 0 40px rgba(0,0,0,.5), -2px 0 8px rgba(0,0,0,.34);
  --shadow-rail:   14px 0 40px rgba(0,0,0,.5);
    --shadow-rail:   14px 0 40px rgba(0,0,0,.5);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --bg:            #101419;
  --surface:       #171D24;
  --surface-2:     #13181F;
  --surface-3:     #1E252E;
  --surface-sunk:  #0C1015;

  --border:        #29323D;
  --border-strong: #3A4552;
  --divider:       #202832;

  --text:          #E7ECF2;
  --text-2:        #A3AEBB;
  --text-3:        #8B96A3;
  --glyph:         #6E7885;

  --accent:        #3FA7B4;
  --accent-hover:  #55BAC6;
  --accent-ink:    #6FC6D1;
  --accent-soft:   #16303A;
  --accent-line:   #23505C;
  --on-accent:     #08252A;

  --today-bg:      #14301F;
  --today-line:    #27563A;
  --holiday-bg:    #32191C;
  --holiday-line:  #5A2A2E;

  --warn-bg:       #2E1D12;
  --warn-line:     #573A24;
  --warn-ink:      #E8B98F;

  --star:          #D8A93A;
  --star-soft:     #2C2415;

  --ring:          #4FB6C2;
  --dot-ring:      #171D24;
  --flag-edge:     rgba(255,255,255,.18);
  --scrim:         rgba(4,7,10,.62);
  --shadow-sm:     0 1px 2px rgba(0,0,0,.4);
  --shadow-md:     0 2px 8px rgba(0,0,0,.34), 0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:     -14px 0 40px rgba(0,0,0,.5), -2px 0 8px rgba(0,0,0,.34);
  --shadow-rail:   14px 0 40px rgba(0,0,0,.5);
}

/* ============================================================
   Surfaces du navigateur — sélection, caret, ascenseurs, focus.
   ============================================================ */
html, body, #root { height:100%; margin:0; }
body { background:var(--bg); }
::selection { background:var(--accent-soft); color:var(--text); }
.jf ::-webkit-scrollbar { width:10px; height:10px; }
.jf ::-webkit-scrollbar-track { background:transparent; }
.jf ::-webkit-scrollbar-thumb {
  background:var(--border-strong); border-radius:var(--r-pill);
  border:3px solid transparent; background-clip:content-box;
}
.jf ::-webkit-scrollbar-thumb:hover { background-clip:content-box; background-color:var(--glyph); }
.jf * { scrollbar-width:thin; scrollbar-color:var(--border-strong) transparent; }

.jf, .jf * { box-sizing:border-box; }
.jf {
  font-family:'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size:var(--fs-base);
  color:var(--text); background:var(--bg);
  height:100%; display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.jf .mono { font-family:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; }
/* les chiffres de dates ne doivent pas danser d'une cellule à l'autre */
.jf .num { font-variant-numeric:tabular-nums; }

.jf button, .jf input, .jf select { font:inherit; color:inherit; }
.jf :focus-visible { outline:2px solid var(--ring); outline-offset:2px; border-radius:var(--r-sm); }
.jf input { caret-color:var(--accent); }

/* ============================================================
   En-tête
   ============================================================ */
.jf-top {
  display:flex; align-items:center; gap:14px; padding:10px 16px;
  background:var(--surface); border-bottom:1px solid var(--border);
  flex-wrap:wrap; row-gap:10px;
}
.jf-brand { display:flex; align-items:center; gap:10px; margin-right:auto; min-width:0; }
.jf-brand .mark {
  width:30px; height:30px; border-radius:var(--r-md); flex:none;
  background:var(--accent); color:var(--on-accent);
  display:grid; place-items:center;
}
.jf-brand h1 {
  font-size:var(--fs-md); font-weight:600; margin:0;
  letter-spacing:-0.012em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.jf-brand p { font-size:var(--fs-xs); color:var(--text-3); margin:2px 0 0; white-space:nowrap; }

.jf-topright { display:flex; align-items:center; gap:10px; flex-wrap:wrap; row-gap:10px; }
.jf-sep { width:1px; height:22px; background:var(--border); flex:none; }

.jf-seg {
  display:inline-flex; background:var(--surface-3); border:1px solid var(--border);
  border-radius:var(--r-md); padding:2px; flex:none;
}
.jf-seg button {
  border:0; background:transparent; font-size:var(--fs-base); color:var(--text-2);
  padding:5px 12px; border-radius:var(--r-sm); cursor:pointer;
  transition:background .16s ease, color .16s ease;
}
.jf-seg button:hover { color:var(--text); }
.jf-seg button[aria-pressed="true"] {
  background:var(--surface); color:var(--text); font-weight:500; box-shadow:var(--shadow-sm);
}

.jf-nav { display:flex; align-items:center; gap:6px; }
.jf-nav .period {
  font-size:var(--fs-md); font-weight:500; min-width:178px; text-align:center;
  letter-spacing:-0.008em; font-variant-numeric:tabular-nums;
}
.jf-ico {
  width:30px; height:30px; border-radius:var(--r-md); flex:none;
  border:1px solid var(--border); background:var(--surface); color:var(--text-2);
  display:grid; place-items:center; cursor:pointer;
  transition:background .16s ease, border-color .16s ease, color .16s ease;
}
.jf-ico:hover { background:var(--surface-3); border-color:var(--border-strong); color:var(--text); }
.jf-ico:active { background:var(--surface-sunk); }

.jf-today {
  font-size:var(--fs-base); padding:6px 12px; border-radius:var(--r-md);
  border:1px solid var(--accent-line); background:var(--accent-soft); color:var(--accent-ink);
  font-weight:500; cursor:pointer; white-space:nowrap;
  transition:background .16s ease, border-color .16s ease;
}
.jf-today:hover { border-color:var(--accent); }

.jf-railtoggle {
  display:none; font-size:var(--fs-base); padding:6px 11px; border-radius:var(--r-md);
  border:1px solid var(--border); background:var(--surface); color:var(--text-2);
  cursor:pointer; align-items:center; gap:7px; white-space:nowrap;
}
.jf-railtoggle:hover { background:var(--surface-3); color:var(--text); }

/* --- sélecteur de langue : menu sur mesure, pour porter les drapeaux --- */
.jf-langwrap { position:relative; flex:none; }
.jf-langbtn {
  display:inline-flex; align-items:center; gap:8px; padding:5px 9px 5px 8px;
  border:1px solid var(--border); border-radius:var(--r-md);
  background:var(--surface); color:var(--text); cursor:pointer;
  transition:background .16s ease, border-color .16s ease;
}
.jf-langbtn:hover { background:var(--surface-3); border-color:var(--border-strong); }
.jf-langbtn .lname { font-size:var(--fs-base); }
.jf-langbtn .lflag, .jf-langbtn .lflag-fb,
.jf-langmenu .lflag, .jf-langmenu .lflag-fb {
  width:20px; height:14px; border-radius:2px; flex:none;
  box-shadow:inset 0 0 0 1px var(--flag-edge); background:var(--surface-3);
}
.jf-langbtn .lflag, .jf-langmenu .lflag { object-fit:cover; }
.jf-langbtn .lflag-fb, .jf-langmenu .lflag-fb {
  display:grid; place-items:center; font-size:8px; color:var(--text-3);
}
.jf-langbtn .chev { color:var(--glyph); display:grid; transition:transform .18s ease; }
.jf-langbtn[aria-expanded="true"] .chev { transform:rotate(180deg); }

.jf-langmenu {
  position:fixed; z-index:60; min-width:188px; padding:5px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  box-shadow:var(--shadow-md); display:flex; flex-direction:column; gap:1px;
  animation:jf-pop .14s cubic-bezier(.2,.8,.3,1);
}
@keyframes jf-pop { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
.jf-langmenu button {
  display:flex; align-items:center; gap:9px; width:100%; padding:7px 9px;
  border:0; background:transparent; border-radius:var(--r-md); cursor:pointer;
  font-size:var(--fs-base); color:var(--text); text-align:left;
}
.jf-langmenu button:hover { background:var(--surface-3); }
.jf-langmenu button[aria-checked="true"] { background:var(--accent-soft); color:var(--accent-ink); font-weight:500; }
.jf-langmenu .tick { margin-left:auto; color:var(--accent); display:grid; }

/* --- bascule de thème --- */
.jf-theme {
  display:inline-flex; align-items:center; gap:0; padding:2px; flex:none;
  background:var(--surface-3); border:1px solid var(--border); border-radius:var(--r-md);
}
.jf-theme button {
  width:28px; height:26px; border:0; background:transparent; border-radius:var(--r-sm);
  color:var(--text-3); display:grid; place-items:center; cursor:pointer;
  transition:background .16s ease, color .16s ease;
}
.jf-theme button:hover { color:var(--text); }
.jf-theme button[aria-pressed="true"] {
  background:var(--surface); color:var(--accent-ink); box-shadow:var(--shadow-sm);
}

.jf-themecycle { display:none; }

/* ============================================================
   Corps et colonne latérale
   ============================================================ */
.jf-body { display:flex; flex:1; min-height:0; position:relative; }

.jf-rail {
  width:274px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; min-height:0;
}
.jf-rail h2 {
  font-size:var(--fs-sm); font-weight:600; color:var(--text); margin:0;
  padding:15px 16px 9px; display:flex; align-items:center; justify-content:space-between;
  letter-spacing:.005em;
}
.jf-rail h2 .count {
  color:var(--text-3); font-weight:500; font-variant-numeric:tabular-nums;
  background:var(--surface-3); border-radius:var(--r-pill); padding:1px 8px;
}
.jf-search { position:relative; padding:0 16px 10px; }
.jf-search input {
  width:100%; font-size:var(--fs-base); padding:7px 10px 7px 31px;
  border:1px solid var(--border); border-radius:var(--r-md);
  background:var(--surface-3); color:var(--text);
  transition:background .16s ease, border-color .16s ease;
}
.jf-search input::placeholder { color:var(--text-3); }
.jf-search input:focus { background:var(--surface); border-color:var(--accent-line); }
.jf-search svg { position:absolute; left:26px; top:8px; color:var(--glyph); pointer-events:none; }

.jf-group {
  font-size:var(--fs-xs); color:var(--text-3); padding:10px 16px 4px;
  letter-spacing:.04em; text-transform:uppercase; font-weight:500;
}
.jf-list { overflow-y:auto; flex:1; padding-bottom:10px; overscroll-behavior:contain; }

.jf-crow {
  width:100%; display:flex; align-items:center; gap:9px; padding:6px 16px; border:0;
  background:transparent; cursor:pointer; text-align:left; color:var(--text);
  transition:background .12s ease;
}
.jf-crow:hover { background:var(--surface-3); }
.jf-crow .swatch { width:9px; height:9px; border-radius:2px; flex:none; }
.jf-crow .flag, .jf-crow .flag-fb {
  width:22px; height:16px; border-radius:2px; flex:none;
  box-shadow:inset 0 0 0 1px var(--flag-edge); background:var(--surface-3);
}
.jf-crow .flag { object-fit:cover; }
.jf-crow .flag-fb { display:grid; place-items:center; font-size:9px; color:var(--text-3); }
.jf-crow .cname {
  flex:1; font-size:var(--fs-base); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.jf-crow .code { font-size:var(--fs-xs); color:var(--text-3); letter-spacing:.03em; }
.jf-crow .rm {
  color:var(--glyph); display:grid; place-items:center; width:19px; height:19px;
  border-radius:var(--r-sm); flex:none; transition:background .12s ease, color .12s ease;
}
.jf-crow.sel { background:var(--surface-2); }
.jf-crow.sel:hover { background:var(--surface-3); }
.jf-crow.sel:hover .rm { background:var(--surface-sunk); color:var(--text); }
.jf-star {
  color:var(--glyph); display:grid; place-items:center; width:21px; height:21px;
  border-radius:var(--r-sm); flex:none; transition:background .12s ease, color .12s ease;
}
.jf-star:hover { background:var(--star-soft); color:var(--star); }
.jf-star.on { color:var(--star); }
.jf-check {
  width:16px; height:16px; border-radius:var(--r-sm); border:1.5px solid var(--border-strong);
  flex:none; display:grid; place-items:center; transition:background .14s ease, border-color .14s ease;
}
.jf-crow:hover .jf-check { border-color:var(--glyph); }
.jf-check.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }

.jf-railnote {
  font-size:var(--fs-xs); color:var(--text-3); padding:10px 16px;
  border-top:1px solid var(--border); line-height:1.55;
}
.jf-railnote b { color:var(--text-2); font-weight:500; }

/* squelettes de chargement plutôt qu'un texte d'attente */
.jf-skel { padding:2px 16px; display:flex; flex-direction:column; gap:9px; }
.jf-skel span {
  height:17px; border-radius:var(--r-sm);
  background:linear-gradient(90deg, var(--surface-3) 25%, var(--surface-sunk) 37%, var(--surface-3) 63%);
  background-size:400% 100%; animation:jf-shimmer 1.3s ease-in-out infinite;
}
@keyframes jf-shimmer { from { background-position:100% 0; } to { background-position:0 0; } }

/* ============================================================
   Zone principale
   ============================================================ */
.jf-main { flex:1; min-width:0; overflow:auto; padding:16px 18px 22px; }

.jf-dow { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; margin-bottom:7px; }
.jf-dow span {
  font-size:var(--fs-xs); color:var(--text-3); text-align:left; padding:0 7px;
  font-weight:500; letter-spacing:.03em;
}
.jf-month {
  display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:minmax(82px,1fr);
  gap:1px; background:var(--divider); border:1px solid var(--border);
  border-radius:var(--r-lg); overflow:hidden; min-height:66vh;
}
.jf-cell {
  background:var(--surface); border:0; text-align:left; cursor:pointer;
  padding:6px 7px; display:flex; flex-direction:column; gap:6px; position:relative;
  transition:background .12s ease;
}
.jf-cell:hover { background:var(--surface-3); }
.jf-cell.out { background:var(--surface-2); }
.jf-cell.out .dnum { color:var(--text-3); }
.jf-cell.wknd { background:var(--surface-3); }
.jf-cell.wknd.out { background:var(--surface-2); }
.jf-cell.holiday { background:var(--holiday-bg); }
.jf-cell.holiday:hover { background:var(--holiday-bg); box-shadow:inset 0 0 0 1px var(--holiday-line); }
.jf-cell.today { background:var(--today-bg); box-shadow:inset 0 0 0 1px var(--today-line); }
.jf-cell .dnum {
  font-size:var(--fs-base); color:var(--text); font-weight:500; line-height:1;
  width:23px; height:21px; display:grid; place-items:center; border-radius:var(--r-sm);
  font-variant-numeric:tabular-nums;
}
.jf-cell.today .dnum { background:var(--accent); color:var(--on-accent); font-weight:600; }
.jf-dots { display:flex; flex-wrap:wrap; gap:4px; align-content:flex-start; }
.jf-dot { width:10px; height:10px; border-radius:50%; box-shadow:0 0 0 1.5px var(--dot-ring); }
.jf-more { font-size:10px; color:var(--text-3); line-height:10px; font-variant-numeric:tabular-nums; }
.jf-tag {
  font-size:var(--fs-xs); color:var(--text-2); display:flex; align-items:center; gap:5px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:auto;
}
.jf-tag .d { width:6px; height:6px; border-radius:50%; flex:none; }

/* --- vue Semaine --- */
.jf-week {
  display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--divider);
  border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; min-height:66vh;
}
.jf-wcol { background:var(--surface); display:flex; flex-direction:column; min-height:0; }
.jf-wcol.wknd { background:var(--surface-3); }
.jf-whead {
  padding:9px 10px; border-bottom:1px solid var(--divider); cursor:pointer;
  transition:background .12s ease;
}
.jf-whead:hover { background:var(--surface-3); }
.jf-whead .dow { font-size:var(--fs-xs); color:var(--text-3); letter-spacing:.03em; }
.jf-whead .dn { font-size:var(--fs-xl); font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-0.02em; }
.jf-whead .dn.today {
  color:var(--on-accent); background:var(--accent); width:28px; height:28px;
  border-radius:var(--r-md); display:grid; place-items:center; font-size:var(--fs-md);
}
.jf-wbody { padding:8px; display:flex; flex-direction:column; gap:6px; overflow-y:auto; }
.jf-bar {
  border:1px solid var(--border); text-align:left; cursor:pointer; background:var(--surface);
  border-radius:var(--r-md); padding:6px 8px; display:flex; gap:8px; align-items:center;
  position:relative; overflow:hidden; transition:background .12s ease, border-color .12s ease;
}
.jf-bar .cdot {
  width:7px; height:7px; border-radius:50%; flex:none;
  box-shadow:0 0 0 1.5px var(--dot-ring);
}
.jf-bar:hover { background:var(--surface-3); border-color:var(--border-strong); }
.jf-bar .flag, .jf-bar .flag-fb {
  width:18px; height:13px; border-radius:2px; flex:none;
  box-shadow:inset 0 0 0 1px var(--flag-edge); background:var(--surface-3);
}
.jf-bar .flag { object-fit:cover; }
.jf-bar .flag-fb { display:grid; place-items:center; font-size:8px; color:var(--text-3); }
.jf-bar .bn { font-size:var(--fs-sm); line-height:1.3; overflow:hidden; min-width:0; }
.jf-bar .bn b { font-weight:500; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.jf-bar .bn span { color:var(--text-3); font-size:var(--fs-xs); }

/* --- vue Jour --- */
.jf-day { max-width:720px; }
.jf-verdict {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-xl);
  padding:17px 19px; margin-bottom:16px; box-shadow:var(--shadow-sm);
}
.jf-verdict .big { font-size:var(--fs-lg); font-weight:600; letter-spacing:-0.012em; }
.jf-verdict .sub { font-size:var(--fs-base); color:var(--text-3); margin-top:4px; }
.jf-verdict .wk {
  display:inline-block; margin-left:9px; font-size:var(--fs-xs); color:var(--text-2);
  background:var(--surface-3); border:1px solid var(--border);
  padding:2px 8px; border-radius:var(--r-pill); vertical-align:middle; font-weight:450;
}
.jf-daysec { margin-top:16px; }
.jf-daysec .lbl {
  font-size:var(--fs-xs); color:var(--text-3); margin-bottom:9px;
  text-transform:uppercase; letter-spacing:.04em; font-weight:500;
}

.jf-hcard {
  display:flex; gap:12px; padding:12px 14px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r-lg); margin-bottom:8px;
  align-items:flex-start;
}
.jf-hcard .flag, .jf-hcard .flag-fb {
  width:25px; height:18px; border-radius:2px; flex:none; margin-top:2px;
  box-shadow:inset 0 0 0 1px var(--flag-edge); background:var(--surface-3);
}
.jf-hcard .flag { object-fit:cover; }
.jf-hcard .flag-fb { display:grid; place-items:center; font-size:9px; color:var(--text-3); }
.jf-hcard .jf-hbody { min-width:0; }
.jf-hcard .co { font-size:var(--fs-xs); color:var(--text-3); letter-spacing:.02em; }
.jf-hcard .nm { font-size:var(--fs-md); font-weight:500; margin-top:1px; }
.jf-hcard .en { font-size:var(--fs-sm); color:var(--text-3); margin-top:2px; }
.jf-hcard .en .lbl { color:var(--glyph); }
.jf-badge {
  font-size:10.5px; padding:2px 7px; border-radius:var(--r-pill); margin-left:7px;
  background:var(--accent-soft); color:var(--accent-ink); vertical-align:middle;
  font-weight:500; white-space:nowrap;
}
.jf-badge.reg { background:var(--warn-bg); color:var(--warn-ink); }
.jf-wiki {
  display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-sm);
  color:var(--accent-ink); text-decoration:none; margin-top:8px;
  text-underline-offset:3px; text-decoration-thickness:1px;
}
.jf-wiki:hover { text-decoration:underline; }

.jf-chips { display:flex; flex-wrap:wrap; gap:7px; }
.jf-chip {
  display:flex; align-items:center; gap:7px; padding:4px 10px 4px 7px;
  border-radius:var(--r-pill); background:var(--surface); border:1px solid var(--border);
  font-size:var(--fs-sm); color:var(--text-2);
}
.jf-chip .flag, .jf-chip .flag-fb {
  width:17px; height:12px; border-radius:2px; flex:none;
  box-shadow:inset 0 0 0 1px var(--flag-edge); background:var(--surface-3);
}
.jf-chip .flag { object-fit:cover; }
.jf-chip .flag-fb { display:grid; place-items:center; font-size:7px; color:var(--text-3); }

/* --- vue Année --- */
.jf-year { display:grid; grid-template-columns:repeat(4,1fr); gap:13px; }
.jf-mini {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:12px 12px 10px;
}
.jf-mini .mtitle {
  font-size:var(--fs-sm); font-weight:600; margin-bottom:9px; letter-spacing:-0.005em;
}
.jf-mgrid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.jf-mgrid .h { font-size:9.5px; color:var(--text-3); text-align:center; padding-bottom:3px; font-weight:500; }
.jf-mday {
  aspect-ratio:1; border:0; background:transparent; font-size:var(--fs-xs);
  color:var(--text-2); cursor:pointer; border-radius:var(--r-sm); display:flex;
  flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:0;
  font-variant-numeric:tabular-nums; transition:background .12s ease;
}
.jf-mday:hover { background:var(--surface-3); color:var(--text); }
.jf-mday.empty { cursor:default; }
.jf-mday.wknd { color:var(--text-3); }
.jf-mday.holiday { background:var(--holiday-bg); color:var(--text); }
.jf-mday.today { background:var(--accent); color:var(--on-accent); font-weight:600; }
.jf-mday .mdots { display:flex; gap:2px; height:5px; }
.jf-mday .mdot { width:5px; height:5px; border-radius:50%; }

/* ============================================================
   Volet latéral
   ============================================================ */
.jf-scrim {
  position:absolute; inset:0; background:var(--scrim); z-index:20;
  animation:jf-fade .16s ease;
}
@keyframes jf-fade { from { opacity:0; } to { opacity:1; } }
.jf-drawer {
  position:absolute; top:0; right:0; height:100%; width:392px; max-width:100%;
  background:var(--surface); border-left:1px solid var(--border); z-index:21;
  display:flex; flex-direction:column; box-shadow:var(--shadow-lg);
  animation:jf-slide .24s cubic-bezier(.2,.9,.25,1);
}
@keyframes jf-slide {
  from { transform:translateX(26px); opacity:.55; }
  to   { transform:none; opacity:1; }
}
.jf-dhead {
  padding:16px 18px; border-bottom:1px solid var(--border);
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
}
.jf-dhead .dt {
  font-size:var(--fs-lg); font-weight:600; letter-spacing:-0.012em;
}
.jf-dhead .dt::first-letter { text-transform:uppercase; }
.jf-dhead .vd { font-size:var(--fs-sm); color:var(--text-3); margin-top:3px; }
.jf-dbody { overflow-y:auto; padding:15px 18px 20px; flex:1; overscroll-behavior:contain; }
.jf-dlink {
  font-size:var(--fs-base); color:var(--accent-ink); background:transparent; border:0;
  cursor:pointer; padding:0; margin-top:7px; text-underline-offset:3px;
}
.jf-dlink:hover { text-decoration:underline; }
.jf-dnote { color:var(--text-3); font-size:var(--fs-base); margin:2px 0 16px; line-height:1.5; }
.jf-dsec {
  font-size:var(--fs-xs); color:var(--text-3); margin:16px 0 9px;
  text-transform:uppercase; letter-spacing:.04em; font-weight:500;
}

/* ============================================================
   États vides et erreurs
   ============================================================ */
.jf-empty { display:grid; place-items:center; height:100%; text-align:center; padding:24px; }
.jf-empty .ic {
  width:44px; height:44px; border-radius:var(--r-xl); background:var(--surface);
  border:1px solid var(--border); display:grid; place-items:center;
  margin:0 auto 15px; color:var(--glyph); box-shadow:var(--shadow-sm);
}
.jf-empty h3 { font-size:var(--fs-md); font-weight:600; margin:0 0 6px; color:var(--text); }
.jf-empty p { font-size:var(--fs-base); max-width:320px; line-height:1.55; color:var(--text-3); margin:0; }

.jf-banner {
  background:var(--warn-bg); border:1px solid var(--warn-line); color:var(--warn-ink);
  font-size:var(--fs-sm); padding:9px 13px; border-radius:var(--r-md); margin-bottom:14px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.jf-banner button {
  font-size:var(--fs-sm); color:var(--warn-ink); background:transparent;
  border:1px solid var(--warn-line); border-radius:var(--r-sm); padding:3px 10px;
  cursor:pointer; font-weight:500; white-space:nowrap;
}
.jf-banner button:hover { background:var(--surface); }

/* ============================================================
   Adaptation aux écrans
   ============================================================ */
@media (max-width:1180px) {
  .jf-year { grid-template-columns:repeat(3,1fr); }
}
@media (max-width:980px) {
  .jf-brand p { display:none; }
  .jf-nav .period { min-width:150px; }
}
@media (max-width:880px) {
  .jf-rail {
    position:absolute; top:0; left:0; height:100%; z-index:30; width:290px;
    transform:translateX(-100%); transition:transform .24s cubic-bezier(.2,.9,.25,1);
    box-shadow:var(--shadow-rail);
  }
  .jf-rail.open { transform:none; }
  .jf-railtoggle { display:inline-flex; }
  .jf-year { grid-template-columns:repeat(2,1fr); }
  .jf-main { padding:14px 14px 20px; }
}
@media (max-width:720px) {
  .jf-top { gap:8px; padding:9px 12px; row-gap:8px; }
  .jf-brand h1 { font-size:var(--fs-base); }
  .jf-topright { width:100%; justify-content:space-between; gap:8px; }
  .jf-nav { order:-1; width:100%; justify-content:space-between; }
  .jf-nav .period { min-width:0; flex:1; }
  .jf-sep { display:none; }
  /* le libellé de langue cède la place : le drapeau suffit à identifier
     la langue active, et les trois blocs tiennent alors sur une rangée */
  .jf-langbtn .lname { display:none; }
  .jf-langbtn { padding:5px 7px; gap:6px; }
  .jf-theme { display:none; }
  .jf-themecycle {
    display:grid; place-items:center; width:34px; height:32px; flex:none;
    border:1px solid var(--border); border-radius:var(--r-md);
    background:var(--surface); color:var(--text-2); cursor:pointer;
  }
  .jf-themecycle:hover { background:var(--surface-3); color:var(--text); }
  /* dvh tient compte de la barre d'adresse mobile ; vh sert de repli */
  .jf-month, .jf-week { min-height:calc(100vh - 200px); }
  .jf-month, .jf-week { min-height:calc(100dvh - 200px); }
  .jf-month { grid-auto-rows:minmax(64px,1fr); }
  .jf-cell { padding:5px; gap:4px; }
  .jf-cell .dnum { width:21px; height:19px; font-size:var(--fs-sm); }
  .jf-tag { display:none; }
  .jf-dow span { padding:0 4px; font-size:10px; }
  .jf-drawer { width:100%; border-left:0; }
  .jf-week { grid-template-columns:1fr; min-height:0; }
  .jf-wcol { min-height:64px; }
  .jf-whead { display:flex; align-items:center; gap:9px; }
  .jf-whead .dow { order:2; }
}
@media (pointer:coarse) {
  .jf-theme button { width:34px; height:30px; }
  .jf-ico { width:34px; height:34px; }
  .jf-star, .jf-crow .rm { width:26px; height:26px; }
  .jf-crow { padding-top:8px; padding-bottom:8px; }
  .jf-langmenu button { padding:9px; }
}
@media (max-width:520px) {
  .jf-year { grid-template-columns:1fr; }
  .jf-seg button { padding:5px 9px; font-size:var(--fs-sm); }
  .jf-verdict { padding:14px 15px; }
}

@media (prefers-reduced-motion: reduce) {
  .jf *, .jf-drawer, .jf-rail, .jf-langmenu, .jf-scrim, .jf-skel span {
    animation:none !important; transition:none !important;
  }
}

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const startOfWeek = d => addDays(d, -((d.getDay()+6)%7));
const sameDay = (a, b) => ymd(a) === ymd(b);
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const isWknd = d => d.getDay()===0 || d.getDay()===6;

/* clé normalisée : fusionne les variantes de ponctuation et d'apostrophe
   ("All Saints' Day" / "All Saints Day", "Christmas Day (Orthodox)"…) */
const normKey = s => norm(s).replace(/[‘’'`´]/g,'')
                            .replace(/[^a-z0-9]+/g,' ').trim();

const HOL = {};
for (const [aliases, wiki, tr] of HOL_RAW)
  for (const a of aliases) HOL[normKey(a)] = { w: wiki, ...tr };

/* ---- formatage dépendant de la langue (mémoïsé) ---- */
const localeOf = lang => (LANGS.find(l => l.code===lang) || LANGS[0]).locale;
const _regionCache = {}, _dowCache = {};

function regionName(lang, code, fallback){
  if (!_regionCache[lang]) {
    try { _regionCache[lang] = new Intl.DisplayNames([localeOf(lang)], { type:'region' }); }
    catch (e) { _regionCache[lang] = null; }
  }
  try { return (_regionCache[lang] && _regionCache[lang].of(code)) || fallback; }
  catch (e) { return fallback; }
}
function makeFmt(lang){
  const loc = localeOf(lang);
  return (d, o) => { try { return new Intl.DateTimeFormat(loc, o).format(d); } catch (e) { return ymd(d); } };
}
/* jours de la semaine dérivés de la locale, lundi en premier */
function dowLabels(lang){
  if (_dowCache[lang]) return _dowCache[lang];
  const loc = localeOf(lang);
  const ref = new Date(2024, 0, 1); // un lundi
  let shrt = [], nar = [];
  try {
    const fs = new Intl.DateTimeFormat(loc, { weekday:'short' });
    const fn = new Intl.DateTimeFormat(loc, { weekday:'narrow' });
    for (let i=0; i<7; i++){
      shrt.push(fs.format(addDays(ref, i)));
      nar.push(fn.format(addDays(ref, i)));
    }
  } catch (e) {
    shrt = ['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'];
    nar  = ['L','M','M','J','V','S','D'];
  }
  return (_dowCache[lang] = { short: shrt, narrow: nar });
}

/* ---- cascade de résolution du nom d'un jour férié ----
   1. langue choisie  : localName si le pays parle cette langue, sinon dictionnaire
   2. anglais         : le champ name de Nager.Date, toujours renseigné
   3. langue d'origine: localName
   Le niveau 3 n'est en pratique jamais atteint (aucun name vide sur 2 666
   entrées mesurées), mais il garantit qu'aucun nom ne peut être vide.        */
function resolveName(h, lang){
  const entry = HOL[normKey(h.name)];
  if (lang === 'en') return { text: h.name || h.localName, tier:'target', entry };
  const home = LANG_HOME[lang];
  if (home && home.has(h.countryCode) && h.localName)
    return { text: h.localName, tier:'target', entry };
  if (entry && entry[lang]) return { text: entry[lang], tier:'target', entry };
  if (h.name) return { text: h.name, tier:'en', entry };
  return { text: h.localName, tier:'local', entry };
}

/* ---- Wikipédia : titre traduit + lien, même cascade ----
   Un seul appel à l'API anglaise : on demande l'article correspondant au nom
   anglais et son interlangue vers la langue choisie. On en tire le titre
   traduit (qui peut enrichir le niveau 1 de la cascade ci-dessus) et l'URL.
   Réponses mises en cache dans localStorage, y compris les absences.         */
const wikiMem = {};
try {
  const raw = localStorage.getItem(LS_WIKI);
  if (raw) Object.assign(wikiMem, JSON.parse(raw));
} catch (e) {}
let wikiSaveTimer = null;
function wikiPersist(){
  clearTimeout(wikiSaveTimer);
  wikiSaveTimer = setTimeout(() => {
    try {
      const keys = Object.keys(wikiMem);
      if (keys.length > 600) keys.slice(0, keys.length-600).forEach(k => delete wikiMem[k]);
      localStorage.setItem(LS_WIKI, JSON.stringify(wikiMem));
    } catch (e) {}
  }, 400);
}
const wikiUrl = (lang, title) =>
  `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(title.replace(/ /g,'_'))}`;
const wikiSearchUrl = (lang, q) =>
  `https://${lang}.wikipedia.org/w/index.php?search=${encodeURIComponent(q)}`;

async function wikiLookup(enTitle, lang){
  const key = `${lang}|${enTitle}`;
  if (key in wikiMem) return wikiMem[key];
  const api = 'https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*'
            + '&redirects=1&prop=langlinks&lllimit=500&titles=' + encodeURIComponent(enTitle);
  let out = null;
  try {
    const r = await fetch(api);
    if (r.ok){
      const j = await r.json();
      const pages = (j.query && j.query.pages) || {};
      const page = Object.values(pages)[0];
      if (page && !('missing' in page)){
        const ll = (page.langlinks || []).find(l => l.lang === lang);
        out = ll
          ? { tier:'target', title: ll['*'], url: wikiUrl(lang, ll['*']) }
          : { tier:'en',     title: page.title, url: wikiUrl('en', page.title) };
      }
    }
  } catch (e) { out = undefined; }
  if (out !== undefined){ wikiMem[key] = out; wikiPersist(); }
  return out;
}

/* Résout le lien (et éventuellement le titre traduit) d'un jour férié. */
function useWiki(h, lang, active){
  const [res, setRes] = useState(null);
  const enTitle = h ? ((HOL[normKey(h.name)] || {}).w || h.name) : null;
  useEffect(() => {
    if (!active || !h || !enTitle){ setRes(null); return; }
    if (lang === 'en'){
      setRes({ tier:'en', title: enTitle, url: wikiUrl('en', enTitle) });
      return;
    }
    let alive = true;
    const key = `${lang}|${enTitle}`;
    if (key in wikiMem){ setRes(wikiMem[key]); return; }
    setRes(undefined); // en cours
    wikiLookup(enTitle, lang).then(r => { if (alive) setRes(r); });
    return () => { alive = false; };
  }, [enTitle, lang, active]);
  return res;
}

function monthGrid(focus){
  const first = new Date(focus.getFullYear(), focus.getMonth(), 1);
  const start = startOfWeek(first);
  return Array.from({length:42}, (_, i) => addDays(start, i));
}
function miniMatrix(year, month){
  const first = new Date(year, month, 1);
  const off = (first.getDay()+6)%7;
  const days = new Date(year, month+1, 0).getDate();
  const cells = Array(off).fill(null);
  for (let d=1; d<=days; d++) cells.push(new Date(year, month, d));
  while (cells.length % 7 !== 0) cells.push(null);
  return cells;
}
function visibleYears(view, focus){
  const ys = new Set();
  if (view==='day')  ys.add(focus.getFullYear());
  if (view==='week'){ const s=startOfWeek(focus); ys.add(s.getFullYear()); ys.add(addDays(s,6).getFullYear()); }
  if (view==='month'){ const g=monthGrid(focus); ys.add(g[0].getFullYear()); ys.add(g[41].getFullYear()); }
  if (view==='year') ys.add(focus.getFullYear());
  return [...ys];
}

/* ---- contexte de langue ---- */
const I18n = createContext(null);
const useI18n = () => useContext(I18n);

function Flag({ code, cls='flag' }){
  const [broken, setBroken] = useState(false);
  if (broken) return <span className={cls+'-fb mono'}>{code}</span>;
  return <img className={cls} alt="" loading="lazy"
    src={`https://flagcdn.com/${code.toLowerCase()}.svg`} onError={()=>setBroken(true)} />;
}

/* Un <select> natif ne peut pas porter d'image, et Windows ne dispose
   d'aucune police d'emojis drapeaux : d'où ce menu sur mesure, en
   position fixed pour échapper au débordement de l'en-tête. */
function LangPicker(){
  const { lang, setLang, t } = useI18n();
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState(null);
  const btnRef = useRef(null), menuRef = useRef(null);
  const active = LANGS.find(l => l.code===lang) || LANGS[0];

  useEffect(() => {
    if (!open) return;
    const place = () => {
      if (!btnRef.current) return;
      const r = btnRef.current.getBoundingClientRect();
      setPos({ top: Math.round(r.bottom + 6), right: Math.round(Math.max(8, window.innerWidth - r.right)) });
    };
    place();
    const onDown = e => {
      if (btnRef.current && btnRef.current.contains(e.target)) return;
      if (menuRef.current && menuRef.current.contains(e.target)) return;
      setOpen(false);
    };
    const onKey = e => {
      if (e.key === 'Escape'){ e.stopPropagation(); setOpen(false);
        if (btnRef.current) btnRef.current.focus(); }
    };
    document.addEventListener('mousedown', onDown);
    document.addEventListener('keydown', onKey, true);
    window.addEventListener('resize', place);
    window.addEventListener('scroll', place, true);
    return () => {
      document.removeEventListener('mousedown', onDown);
      document.removeEventListener('keydown', onKey, true);
      window.removeEventListener('resize', place);
      window.removeEventListener('scroll', place, true);
    };
  }, [open]);

  return (
    <div className="jf-langwrap">
      <button ref={btnRef} className="jf-langbtn" onClick={()=>setOpen(o=>!o)}
        aria-haspopup="listbox" aria-expanded={open} aria-label={t.language}>
        <Flag code={LANG_COUNTRY[active.code]} cls="lflag"/>
        <span className="lname">{active.label}</span>
        <span className="chev"><ChevronDown size={14}/></span>
      </button>
      {open && pos && (
        <div ref={menuRef} className="jf-langmenu" role="listbox"
          style={{ top:pos.top, right:pos.right }}>
          {LANGS.map(l => (
            <button key={l.code} role="option" aria-selected={l.code===lang}
              aria-checked={l.code===lang} onClick={()=>{ setLang(l.code); setOpen(false); }}>
              <Flag code={LANG_COUNTRY[l.code]} cls="lflag"/>
              <span>{l.label}</span>
              {l.code===lang && <span className="tick"><Check size={14}/></span>}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function ThemeToggle(){
  const { theme, setTheme, t } = useI18n();
  const opts = [
    ['auto',  t.themeAuto,  Monitor],
    ['light', t.themeLight, Sun],
    ['dark',  t.themeDark,  Moon],
  ];
  /* Le groupe de trois ne tient pas sur une rangée de téléphone sans
     renvoyer la sélection de vue à la ligne : en dessous de 720 px, un
     seul bouton affiche le mode courant et fait défiler les trois. */
  const idx = Math.max(0, opts.findIndex(o => o[0] === theme));
  const Cur = opts[idx][2];
  const next = opts[(idx + 1) % opts.length][0];
  const label = `${t.theme} : ${opts[idx][1]}`;
  return (
    <>
      <div className="jf-theme" role="group" aria-label={t.theme}>
        {opts.map(([v, lbl, Ico]) => (
          <button key={v} aria-pressed={theme===v} title={lbl} aria-label={lbl}
            onClick={()=>setTheme(v)}><Ico size={14}/></button>
        ))}
      </div>
      <button className="jf-themecycle" title={label} aria-label={label}
        onClick={()=>setTheme(next)}><Cur size={15}/></button>
    </>
  );
}

function initialLang(){
  try {
    const saved = localStorage.getItem(LS_LANG);
    if (saved && LANG_CODES.includes(saved)) return saved;
  } catch (e) {}
  const prefs = (navigator.languages || [navigator.language || '']).map(String);
  for (const p of prefs){
    const base = p.toLowerCase().split('-')[0];
    if (LANG_CODES.includes(base)) return base;
  }
  return DEFAULT_LANG;
}

function initialTheme(){
  try {
    const s = localStorage.getItem(LS_THEME);
    if (THEMES.includes(s)) return s;
  } catch (e) {}
  return 'auto';
}

function App(){
  const [lang, setLang] = useState(initialLang);
  const [theme, setTheme] = useState(initialTheme);
  const [countries, setCountries] = useState([]);
  const [cstatus, setCstatus]   = useState('loading');
  const [selected, setSelected] = useState([]);
  const [favorites, setFavorites] = useState(() => {
    try {
      const raw = localStorage.getItem('jf-favorites');
      return raw ? new Set(JSON.parse(raw)) : new Set();
    } catch (e) { return new Set(); }
  });
  const [view, setView]   = useState('month');
  const [focus, setFocus] = useState(new Date());
  const [query, setQuery] = useState('');
  const [drawer, setDrawer] = useState(null);
  const [railOpen, setRailOpen] = useState(false);
  const [netError, setNetError] = useState(false);
  const [refresh, setRefresh] = useState(0);
  const cacheRef = useRef({});
  const [cache, setCache] = useState({});
  const didInit = useRef(null);

  useEffect(() => {
    try { localStorage.setItem(LS_LANG, lang); } catch (e) {}
    document.documentElement.lang = lang;
  }, [lang]);

  /* le menu de langue s'ouvrirait sur des drapeaux vides le temps de leur
     téléchargement : on réchauffe le cache dès le montage */
  useEffect(() => {
    Object.values(LANG_COUNTRY).forEach(c => {
      const img = new Image();
      img.src = `https://flagcdn.com/${c.toLowerCase()}.svg`;
    });
  }, []);

  /* 'auto' retire l'attribut pour laisser prefers-color-scheme décider */
  useEffect(() => {
    try { localStorage.setItem(LS_THEME, theme); } catch (e) {}
    const el = document.documentElement;
    if (theme === 'auto') el.removeAttribute('data-theme');
    else el.setAttribute('data-theme', theme);
  }, [theme]);

  const i18n = useMemo(() => ({
    lang, setLang, theme, setTheme,
    t: UI[lang] || UI[DEFAULT_LANG],
    fmt: makeFmt(lang),
    dow: dowLabels(lang),
    name: h => resolveName(h, lang),
    country: code => {
      const c = countries.find(x => x.code === code);
      return c ? regionName(lang, c.code, c.en) : code;
    },
  }), [lang, theme, countries]);
  const { t, fmt } = i18n;

  useEffect(() => {
    let alive = true;
    fetch('https://date.nager.at/api/v3/AvailableCountries')
      .then(r => { if(!r.ok) throw new Error(); return r.json(); })
      .then(list => {
        if(!alive) return;
        setCountries(list.map(c => ({ code:c.countryCode, en:c.name })));
        setCstatus('ready');
      })
      .catch(() => alive && setCstatus('error'));
    return () => { alive = false; };
  }, []);

  /* noms de pays localisés, recalculés au changement de langue */
  const localized = useMemo(() => countries
    .map(c => ({ ...c, label: regionName(lang, c.code, c.en) }))
    .sort((a,b) => a.label.localeCompare(b.label, localeOf(lang))), [countries, lang]);

  /* Le pays de référence de la langue choisie est mis en favori et
     sélectionné. Le garde par référence n'applique la règle qu'au
     changement de langue : l'utilisateur reste libre de retirer le pays
     ensuite sans le voir réapparaître au premier rendu suivant. */
  useEffect(() => {
    if (cstatus !== 'ready') return;
    if (didInit.current === lang) return;
    didInit.current = lang;
    const code = LANG_COUNTRY[lang];
    if (!code) return;
    setFavorites(prev => prev.has(code) ? prev : new Set([...prev, code]));
    setSelected(s => {
      if (s.some(c => c.code === code)) return s;
      const used = new Set(s.map(x => x.color));
      const color = PALETTE.find(p => !used.has(p)) || PALETTE[s.length % PALETTE.length];
      return [...s, { code, color }];
    });
  }, [cstatus, lang]);

  useEffect(() => {
    const years = visibleYears(view, focus);
    selected.forEach(c => years.forEach(async y => {
      const key = `${c.code}:${y}`;
      if (cacheRef.current[key] && cacheRef.current[key] !== 'error') return;
      cacheRef.current[key] = 'loading';
      try {
        const r = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${y}/${c.code}`);
        if(!r.ok) throw new Error();
        const data = await r.json();
        cacheRef.current[key] = 'done';
        setCache(prev => ({ ...prev, [key]: data }));
      } catch (e) {
        cacheRef.current[key] = 'error';
        setNetError(true);
      }
    }));
  }, [selected, view, focus, refresh]);

  const index = useMemo(() => {
    const byCode = Object.fromEntries(selected.map(c => [c.code, c]));
    const idx = {};
    for (const key of Object.keys(cache)){
      const list = cache[key]; if(!Array.isArray(list)) continue;
      const c = byCode[key.split(':')[0]]; if(!c) continue;
      for (const h of list){
        if (!idx[h.date]) idx[h.date] = [];
        idx[h.date].push({ code:c.code, color:c.color, h });
      }
    }
    const rank = Object.fromEntries(selected.map((c,i)=>[c.code,i]));
    for (const k of Object.keys(idx)) idx[k].sort((a,b)=>rank[a.code]-rank[b.code]);
    return idx;
  }, [cache, selected]);

  const isSel = code => selected.some(c => c.code===code);
  const toggle = code => {
    if (isSel(code)) { setSelected(s => s.filter(x => x.code!==code)); return; }
    setSelected(s => {
      const used = new Set(s.map(x => x.color));
      const color = PALETTE.find(p => !used.has(p)) || PALETTE[s.length % PALETTE.length];
      return [...s, { code, color }];
    });
  };
  const toggleFav = (code, e) => {
    e.stopPropagation();
    setFavorites(prev => {
      const next = new Set(prev);
      next.has(code) ? next.delete(code) : next.add(code);
      return next;
    });
  };
  useEffect(() => {
    try { localStorage.setItem('jf-favorites', JSON.stringify([...favorites])); } catch (e) {}
  }, [favorites]);
  const byFavFirst = (a, b) => {
    const fa = favorites.has(a.code), fb = favorites.has(b.code);
    return fa===fb ? 0 : fa ? -1 : 1;
  };

  const filtered = useMemo(() => {
    const q = norm(query);
    const base = localized.filter(c => !isSel(c.code));
    const matched = q ? base.filter(c => norm(c.label).includes(q) || norm(c.en).includes(q)
                                      || c.code.toLowerCase().includes(q)) : base;
    return [...matched].sort(byFavFirst);
  }, [localized, query, selected, favorites]);

  const selectedSorted = useMemo(() => [...selected]
    .map(c => ({ ...c, label: i18n.country(c.code) }))
    .sort(byFavFirst), [selected, favorites, i18n]);

  const step = dir => {
    const d = new Date(focus);
    if (view==='day')   d.setDate(d.getDate()+dir);
    if (view==='week')  d.setDate(d.getDate()+7*dir);
    if (view==='month') { d.setDate(1); d.setMonth(d.getMonth()+dir); }
    if (view==='year')  d.setFullYear(d.getFullYear()+dir);
    setFocus(d);
  };
  const periodLabel = () => {
    if (view==='day')  return cap(fmt(focus, {weekday:'long', day:'numeric', month:'long', year:'numeric'}));
    if (view==='week'){
      const s = startOfWeek(focus), e = addDays(s,6);
      try { return new Intl.DateTimeFormat(localeOf(lang),{day:'numeric',month:'short',year:'numeric'}).formatRange(s,e); }
      catch (err) { return `${fmt(s,{day:'numeric',month:'short'})} – ${fmt(e,{day:'numeric',month:'short',year:'numeric'})}`; }
    }
    if (view==='month') return cap(fmt(focus, {month:'long', year:'numeric'}));
    return String(focus.getFullYear());
  };

  const openDay = d => setDrawer(new Date(d));
  useEffect(() => {
    const h = e => { if(e.key==='Escape'){ setDrawer(null); setRailOpen(false); } };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  }, []);

  const retry = () => {
    Object.keys(cacheRef.current).forEach(k => { if(cacheRef.current[k]==='error') delete cacheRef.current[k]; });
    setNetError(false); setRefresh(x => x+1);
    if (cstatus==='error') setCstatus('loading');
  };

  return (
    <I18n.Provider value={i18n}>
    <div className="jf">
      <div className="jf-top">
        <div className="jf-brand">
          <span className="mark"><Globe size={17}/></span>
          <div>
            <h1>{t.title}</h1>
            <p>{t.sub}</p>
          </div>
        </div>
        <button className="jf-railtoggle" onClick={()=>setRailOpen(o=>!o)}>
          <CalendarDays size={15}/> {t.countriesBtn(selected.length)}
        </button>
        <div className="jf-topright">
          <div className="jf-seg" role="group" aria-label={t.view}>
            {[['day',t.day],['week',t.week],['month',t.month],['year',t.year]].map(([v,l]) => (
              <button key={v} aria-pressed={view===v} onClick={()=>setView(v)}>{l}</button>
            ))}
          </div>
          <div className="jf-nav">
            <button className="jf-ico" aria-label={t.prev} onClick={()=>step(-1)}><ChevronLeft size={17}/></button>
            <span className="period">{periodLabel()}</span>
            <button className="jf-ico" aria-label={t.next} onClick={()=>step(1)}><ChevronRight size={17}/></button>
            <button className="jf-today" onClick={()=>setFocus(new Date())}>{t.today}</button>
          </div>
          <div className="jf-sep"/>
          <LangPicker/>
          <ThemeToggle/>
        </div>
      </div>

      <div className="jf-body">
        {railOpen && <div className="jf-scrim" onClick={()=>setRailOpen(false)} style={{zIndex:29}}/>}

        <aside className={'jf-rail'+(railOpen?' open':'')}>
          <h2>{t.railTitle} <span className="count">{selected.length}</span></h2>
          <div className="jf-search">
            <Search size={15}/>
            <input value={query} onChange={e=>setQuery(e.target.value)} placeholder={t.searchPh} />
          </div>
          {cstatus==='loading' && (
            <div className="jf-skel" role="status" aria-label={t.loadingCountries}>
              {Array.from({length:8}, (_,i) => (
                <span key={i} style={{ width:(92 - i*5) + '%' }}/>
              ))}
            </div>
          )}
          {cstatus==='error' && (
            <div className="jf-railnote">{t.countriesError}
              <br/><button className="jf-dlink" onClick={retry}>{t.retry}</button></div>
          )}
          <div className="jf-list">
            {selected.length>0 && <div className="jf-group">{t.groupSelected}</div>}
            {selectedSorted.map(c => (
              <button key={c.code} className="jf-crow sel" onClick={()=>toggle(c.code)}>
                <span className="swatch" style={{background:c.color}}/>
                <Flag code={c.code}/>
                <span className="cname">{c.label}</span>
                <span className={'jf-star'+(favorites.has(c.code)?' on':'')}
                  onClick={e=>toggleFav(c.code,e)} title={t.favorite}>
                  <StarIcon filled={favorites.has(c.code)}/>
                </span>
                <span className="rm"><X size={14}/></span>
              </button>
            ))}
            {cstatus==='ready' && <div className="jf-group">{t.groupAll}</div>}
            {filtered.map(c => (
              <button key={c.code} className="jf-crow" onClick={()=>toggle(c.code)}>
                <span className="jf-check"/>
                <Flag code={c.code}/>
                <span className="cname">{c.label}</span>
                <span className={'jf-star'+(favorites.has(c.code)?' on':'')}
                  onClick={e=>toggleFav(c.code,e)} title={t.favorite}>
                  <StarIcon filled={favorites.has(c.code)}/>
                </span>
                <span className="code mono">{c.code}</span>
              </button>
            ))}
            {cstatus==='ready' && filtered.length===0 && query &&
              <div className="jf-group">{t.noResults(query)}</div>}
          </div>
          <div className="jf-railnote">
            {t.railWknd} (<b>{t.railWkndSub}</b>). {t.railWkndNote}<br/>
            {t.railData} : <b>Nager.Date</b>.
          </div>
        </aside>

        <main className="jf-main">
          {netError && (
            <div className="jf-banner">
              <span>{t.netError}</span>
              <button onClick={retry}>{t.retry}</button>
            </div>
          )}
          {selected.length===0 ? (
            <div className="jf-empty">
              <div>
                <div className="ic"><CalendarDays size={22}/></div>
                <h3>{t.emptyTitle}</h3>
                <p>{t.empty}</p>
              </div>
            </div>
          ) : view==='month' ? (
            <MonthView focus={focus} index={index} onDay={openDay}/>
          ) : view==='week' ? (
            <WeekView focus={focus} index={index} onDay={openDay}/>
          ) : view==='year' ? (
            <YearView focus={focus} index={index} onDay={openDay}/>
          ) : (
            <DayView focus={focus} index={index} selected={selected}/>
          )}
        </main>

        {drawer && (
          <>
            <div className="jf-scrim" onClick={()=>setDrawer(null)}/>
            <Drawer date={drawer} index={index} selected={selected}
              onClose={()=>setDrawer(null)}
              onGoDay={()=>{ setFocus(new Date(drawer)); setView('day'); setDrawer(null); }}/>
          </>
        )}
      </div>
    </div>
    </I18n.Provider>
  );
}

function verdict(date, index, selected){
  const hits = index[ymd(date)] || [];
  const offCodes = new Set(hits.map(x => x.code));
  const off = selected.filter(c => offCodes.has(c.code));
  const working = selected.filter(c => !offCodes.has(c.code));
  return { hits, off, working, total: selected.length };
}

/* Carte détaillée d'un jour férié : nom dans la langue choisie, nom local
   quand il diffère, et lien Wikipédia suivant la même cascade. */
function HolidayCard({ hit }){
  const { t, lang, name, country } = useI18n();
  const h = hit.h;
  const base = name(h);
  const wiki = useWiki(h, lang, true);
  /* si la cascade est retombée sur l'anglais et que Wikipédia connaît un
     titre dans la langue choisie, il devient le nom affiché */
  const display = (base.tier !== 'target' && wiki && wiki.tier === 'target')
    ? wiki.title : base.text;
  const showLocal = h.localName && h.localName !== display && h.localName !== h.name;
  const showEn = h.name && h.name !== display;
  const link = wiki === undefined ? null
    : wiki ? { url: wiki.url, label: wiki.tier === 'target' ? t.wiki : t.wikiEn }
           : { url: wikiSearchUrl(lang, h.name || h.localName), label: t.wikiSearch };
  return (
    <div className="jf-hcard">
      <Flag code={hit.code}/>
      <div className="jf-hbody">
        <div className="co">{country(hit.code)}</div>
        <div className="nm">{display}
          {h.global ? <span className="jf-badge">{t.national}</span>
                    : <span className="jf-badge reg">{t.regional}</span>}
        </div>
        {showEn && <div className="en">{h.name}</div>}
        {showLocal && <div className="en"><span className="lbl">{t.localNameLbl}</span> {h.localName}</div>}
        {link && (
          <a className="jf-wiki" href={link.url} target="_blank" rel="noopener noreferrer">
            {link.label} <ExternalLink size={12}/>
          </a>
        )}
      </div>
    </div>
  );
}

function MonthView({ focus, index, onDay }){
  const { dow, name } = useI18n();
  const cells = monthGrid(focus);
  const month = focus.getMonth();
  const today = new Date();
  return (
    <>
      <div className="jf-dow">{dow.short.map((d,i) => <span key={i}>{d}</span>)}</div>
      <div className="jf-month">
        {cells.map((d,i) => {
          const hits = index[ymd(d)] || [];
          const out = d.getMonth()!==month;
          const cls = ['jf-cell', out?'out':'', isWknd(d)?'wknd':'', hits.length>0?'holiday':'', sameDay(d,today)?'today':''].join(' ');
          return (
            <button key={i} className={cls} onClick={()=>onDay(d)}>
              <span className="dnum">{d.getDate()}</span>
              {hits.length>0 && (
                <div className="jf-dots">
                  {hits.slice(0,5).map((x,j) => <span key={j} className="jf-dot" style={{background:x.color}}/>)}
                  {hits.length>5 && <span className="jf-more">+{hits.length-5}</span>}
                </div>
              )}
              {hits.length===1 && <span className="jf-tag"><span className="d" style={{background:hits[0].color}}/>{name(hits[0].h).text}</span>}
            </button>
          );
        })}
      </div>
    </>
  );
}

function WeekView({ focus, index, onDay }){
  const { dow, name, country } = useI18n();
  const start = startOfWeek(focus);
  const days = Array.from({length:7}, (_,i) => addDays(start,i));
  const today = new Date();
  return (
    <div className="jf-week">
      {days.map((d,i) => {
        const hits = index[ymd(d)] || [];
        return (
          <div key={i} className={'jf-wcol'+(isWknd(d)?' wknd':'')}>
            <div className="jf-whead" onClick={()=>onDay(d)}>
              <div className="dow">{dow.short[i]}</div>
              <div className={'dn'+(sameDay(d,today)?' today':'')}>{d.getDate()}</div>
            </div>
            <div className="jf-wbody">
              {hits.map((x,j) => (
                <button key={j} className="jf-bar" onClick={()=>onDay(d)}>
                  <span className="cdot" style={{ background:x.color }}/>
                  <Flag code={x.code}/>
                  <span className="bn"><b>{country(x.code)}</b><span>{name(x.h).text}</span></span>
                </button>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function DayView({ focus, index, selected }){
  const { t, fmt, country } = useI18n();
  const { hits, off, working, total } = verdict(focus, index, selected);
  return (
    <div className="jf-day">
      <div className="jf-verdict">
        <div className="big">
          {off.length===0 ? t.verdictNone(total) : t.verdictSome(off.length, total)}
          {isWknd(focus) && <span className="wk">{t.weekend}</span>}
        </div>
        <div className="sub">{cap(fmt(focus, {weekday:'long', day:'numeric', month:'long', year:'numeric'}))}</div>
      </div>
      {off.length>0 && (
        <div className="jf-daysec">
          <div className="lbl">{t.secHoliday}</div>
          {hits.map((x,i) => <HolidayCard key={i} hit={x}/>)}
        </div>
      )}
      {working.length>0 && (
        <div className="jf-daysec">
          <div className="lbl">{t.secWorking} {isWknd(focus) && t.secWorkingNote}</div>
          <div className="jf-chips">
            {working.map(c => (
              <span key={c.code} className="jf-chip"><Flag code={c.code}/>{country(c.code)}</span>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function YearView({ focus, index, onDay }){
  const { fmt, dow } = useI18n();
  const year = focus.getFullYear();
  const today = new Date();
  return (
    <div className="jf-year">
      {Array.from({length:12}, (_,m) => {
        const cells = miniMatrix(year, m);
        return (
          <div key={m} className="jf-mini">
            <div className="mtitle">{cap(fmt(new Date(year,m,1), {month:'long'}))}</div>
            <div className="jf-mgrid">
              {dow.narrow.map((d,i) => <div key={'h'+i} className="h">{d}</div>)}
              {cells.map((d,i) => {
                if(!d) return <span key={i} className="jf-mday empty"/>;
                const hits = index[ymd(d)] || [];
                const cls = ['jf-mday', isWknd(d)?'wknd':'', hits.length>0?'holiday':'', sameDay(d,today)?'today':''].join(' ');
                return (
                  <button key={i} className={cls} onClick={()=>onDay(d)}>
                    <span>{d.getDate()}</span>
                    <span className="mdots">
                      {hits.slice(0,3).map((x,j) => <span key={j} className="mdot" style={{background:x.color}}/>)}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function Drawer({ date, index, selected, onClose, onGoDay }){
  const { t, fmt, country } = useI18n();
  const { hits, off, working, total } = verdict(date, index, selected);
  return (
    <div className="jf-drawer" role="dialog" aria-label={t.drawerLabel}>
      <div className="jf-dhead">
        <div>
          <div className="dt">{cap(fmt(date, {weekday:'long', day:'numeric', month:'long', year:'numeric'}))}</div>
          <div className="vd">
            {off.length===0 ? t.drawerNone(total) : t.drawerSome(off.length, working.length)}
            {isWknd(date) && ` · ${t.weekend}`}
          </div>
          <button className="jf-dlink" onClick={onGoDay}>{t.openDay}</button>
        </div>
        <button className="jf-ico" aria-label={t.close} onClick={onClose}><X size={18}/></button>
      </div>
      <div className="jf-dbody">
        {off.length>0
          ? hits.map((x,i) => <HolidayCard key={i} hit={x}/>)
          : <p className="jf-dnote">{t.allWorking}</p>}
        {working.length>0 && (
          <>
            <div className="jf-dsec">{t.secWorking}</div>
            <div className="jf-chips">
              {working.map(c => <span key={c.code} className="jf-chip"><Flag code={c.code}/>{country(c.code)}</span>)}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

<script>
  // The block above has type="text/babel-src" so neither the browser nor
  // Babel's own auto-scan executes it directly. We transform it here with
  // the "classic" JSX runtime (React.createElement calls) explicitly,
  // because Babel's default "automatic" runtime emits an ES `import`
  // statement that a plain, non-module script tag cannot execute.
  var src = document.getElementById('app-src').textContent;
  var out = Babel.transform(src, {
    presets: [['react', { runtime: 'classic' }]]
  }).code;
  var s = document.createElement('script');
  s.text = out;
  document.body.appendChild(s);
</script>
